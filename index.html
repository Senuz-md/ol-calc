<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O/L Points - System Updating</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: #111;
            border: 1px solid #1a1a1a;
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .icon-box {
            font-size: 45px;
            color: #007AFF;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
        }

        p {
            font-size: 12px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 122, 255, 0.1);
            color: #007AFF;
            border: 1px solid rgba(0, 122, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 30px;
            font-size: 9px;
            color: #444;
            letter-spacing: 2px;
            font-weight: 800;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="fas fa-tools"></i>
        </div>
        <h1>WEB IS UPDATING</h1>
        <p>We are currently upgrading our systems and removing ad configurations. Please check back shortly!</p>
        
        <div class="status-badge">
            <i class="fas fa-sync-alt fa-spin"></i>
            <span>MAINTENANCE IN PROGRESS</span>
        </div>
    </div>

    <div class="footer">
        ©2026 O/L POINTS | BY SENUZ
    </div>

</body>
</html>
